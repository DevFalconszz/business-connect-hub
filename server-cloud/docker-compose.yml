version: '3.8'

services:
  opencode:
    image: node:22-slim
    container_name: opencode-ai
    working_dir: /app
    volumes:
      - ./app:/app
      - opencode-config:/root/.config/opencode
    command: >
      sh -c "
        npm install -g opencode@latest &&
        npm install -g @omniroute/opencode-plugin@latest &&
        mkdir -p /root/.config/opencode &&
        echo '{\"provider\":{\"omniroute\":{\"apiUrl\":\"http://localhost:20128\"}},\"mcp\":{}}' > /root/.config/opencode/opencode.json &&
        opencode serve --port 20128
      "
    ports:
      - "20128:20128"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: research-api
    ports:
      - "3001:3001"
    environment:
      - OPENCODE_URL=http://opencode:20128
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      opencode:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opencode-config:
